<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: #1c1c1e; color: #f5f5f7;
            height: 100vh; display: flex; flex-direction: column;
        }
        .header {
            padding: 12px 20px; border-bottom: 1px solid #3a3a3c;
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        }
        .header h1 { font-size: 1.1em; }
        select, .small-input {
            padding: 6px 12px; border-radius: 8px; border: 1px solid #3a3a3c;
            background: #2c2c2e; color: #f5f5f7; font-size: 0.9em;
        }
        .small-input { width: 80px; }
        .checkbox-label {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.9em; color: #a1a1aa;
        }
        .checkbox-label input { width: 16px; height: 16px; }
        .support-config {
            display: none; align-items: center; gap: 8px;
            padding: 8px 20px; background: #2c2c2e; border-bottom: 1px solid #3a3a3c;
            font-size: 0.9em;
        }
        .support-config.show { display: flex; }
        .support-config label { color: #a1a1aa; }
        .messages {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .message { display: flex; width: 100%; }
        .message.user { justify-content: flex-end; }
        .message.ai { justify-content: flex-start; }
        .bubble {
            max-width: 70%; padding: 10px 14px; border-radius: 16px;
            line-height: 1.5; white-space: pre-wrap; display: inline-block;
        }
        .user .bubble { background: #0A84FF; color: white; border-bottom-right-radius: 4px; }
        .ai .bubble { background: #2c2c2e; border-bottom-left-radius: 4px; }
        .thinking {
            background: rgba(125, 211, 252, 0.1); border-left: 3px solid #7dd3fc;
            padding: 8px 12px; margin-bottom: 8px; border-radius: 0 8px 8px 0;
            font-size: 0.85em; color: #a1a1aa; max-height: 150px; overflow-y: auto;
        }
        .thinking-label { color: #7dd3fc; font-weight: 500; margin-bottom: 4px; }
        .input-area {
            padding: 12px 20px; border-top: 1px solid #3a3a3c;
            display: flex; gap: 10px;
        }
        .input-area input {
            flex: 1; padding: 12px 16px; border-radius: 20px;
            border: 1px solid #3a3a3c; background: #2c2c2e; color: #f5f5f7;
        }
        .input-area input:focus { outline: none; border-color: #0A84FF; }
        .input-area button {
            padding: 12px 24px; background: #0A84FF; color: white;
            border: none; border-radius: 20px; cursor: pointer;
        }
        .input-area button:hover { background: #0070E0; }
        .input-area button:disabled { background: #3a3a3c; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 AI Chat</h1>
        <select id="role" onchange="toggleSupportConfig()">
            <option value="default">通用助手</option>
            <option value="reviewer">代码审查</option>
            <option value="sql">SQL生成</option>
            <option value="weekly">周报助手</option>
            <option value="support">客服模式</option>
        </select>
        <select id="model">
            <option value="qwen3-coder-plus">qwen3-coder-plus (快)</option>
            <option value="glm-4.6">glm-4.6 (强)</option>
        </select>
    </div>
    <div class="support-config" id="supportConfig">
        <label>公司:</label>
        <input type="text" id="company" class="small-input" value="京东" placeholder="公司名">
        <label>客服:</label>
        <input type="text" id="supportName" class="small-input" value="小京" placeholder="客服名">
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
        <input id="input" placeholder="输入消息..." onkeypress="if(event.key==='Enter')send()">
        <button id="sendBtn" onclick="send()">发送</button>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const sendBtn = document.getElementById('sendBtn');
        
        function toggleSupportConfig() {
            const role = document.getElementById('role').value;
            const config = document.getElementById('supportConfig');
            config.classList.toggle('show', role === 'support');
        }
        
        async function send() {
            const input = document.getElementById('input');
            const role = document.getElementById('role').value;
            const model = document.getElementById('model').value;
            const message = input.value.trim();
            if (!message) return;
            
            addMessage(message, 'user');
            input.value = '';
            sendBtn.disabled = true;
            
            try {
                if (role === 'support') {
                    await handleSupport(message);
                } else {
                    await handleStream(message, role, model);
                }
            } finally {
                sendBtn.disabled = false;
            }
        }
        
        async function handleSupport(message) {
            const company = document.getElementById('company').value || '京东';
            const name = document.getElementById('supportName').value || '小京';
            const bubble = addMessage('', 'ai');
            try {
                const res = await fetch(`/support?message=${encodeURIComponent(message)}&company=${encodeURIComponent(company)}&name=${encodeURIComponent(name)}`);
                bubble.textContent = await res.text();
            } catch (e) {
                bubble.textContent = '请求失败: ' + e.message;
            }
        }
        
        async function handleStream(message, role, model) {
            const bubble = addMessage('', 'ai');
            const url = `/stream?message=${encodeURIComponent(message)}&role=${role}&model=${model}`;
            
            return new Promise((resolve) => {
                const es = new EventSource(url);
                let buffer = '';
                
                es.onmessage = (e) => {
                    // 收到的数据追加到气泡
                    if (e.data) {
                        bubble.textContent += e.data;
                        messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    }
                };
                
                es.onerror = (e) => {
                    console.log('SSE closed or error', e);
                    es.close();
                    resolve();
                };
                
                // 超时保护
                setTimeout(() => { es.close(); resolve(); }, 60000);
            });
        }
        
        function addMessage(text, role) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;
            div.appendChild(bubble);
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return bubble;
        }
        
        document.getElementById('input').focus();
    </script>
</body>
</html>
